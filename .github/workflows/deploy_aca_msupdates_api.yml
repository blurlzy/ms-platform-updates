name: Azure Container Apps CI/CD - aca-msupdates-api

on:
  push:
    branches:
      - main
  workflow_dispatch:
   
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/src/backend  # ← build context = src/backend/
          dockerfilePath: MS-Updates/Dockerfile  # relative to appSourcePath
          acrName: acrzl
          imageToBuild: acrzl.azurecr.io/ms-updates-api:${{ github.sha }}
          containerAppName: aca-ms-updates
          resourceGroup: RG-MS-RSS-Reader
